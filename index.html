<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WT AIM Generator | Avionics OS</title>
    <meta name="description" content="WT AIM Generator - Avionics OS and War Thunder custom sight generator using AI vector extraction and .blk export.">
    <meta property="og:title" content="WT AIM Generator | Avionics OS">
    <meta property="og:description" content="WT AIM Generator - Avionics OS and War Thunder custom sight generator using AI vector extraction and .blk export.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Левая панель: Терминал ИИ -->
        <aside class="panel left-panel">
            <div class="panel-header">SYS.TERMINAL // AI INPUT</div>
            
            <div class="control-group">
                <label>API KEY (Gemini 3.8 Flash)</label>
                <input type="password" id="apiKey" placeholder="AIzaSy... (Необязательно)">
            </div>

            <div class="control-group">
                <label>ИСТОЧНИК ДАННЫХ</label>
                <div class="dropzone" id="dropzone">
                    <span>ПЕРЕТАЩИТЕ ИЗОБРАЖЕНИЕ</span>
                    <input type="file" id="fileInput" accept="image/*" hidden>
                </div>
                <button type="button" id="loadSampleBtn" class="action-btn sample-btn" style="margin-top: 8px; font-size: 11px; padding: 6px;">ЗАГРУЗИТЬ ТЕСТОВЫЙ ПРИЦЕЛ</button>
            </div>

            <div class="control-group">
                <label>РЕЖИМ ГЕНЕРАЦИИ</label>
                <select id="detailLevel">
                    <option value="silhouette">ТОЛЬКО СИЛУЭТ (MINIMAL)</option>
                    <option value="detailed">МАКС. ГЕОМЕТРИЯ (DETAILED)</option>
                </select>
            </div>
            
            <button id="generateBtn" class="action-btn">ИНИЦИАЛИЗАЦИЯ ГЕНЕРАЦИИ</button>
            
            <div class="log-window" id="consoleLog">
                <span class="sys-msg">[SYS] STANDBY...</span>
            </div>
        </aside>

        <!-- Центральная часть: Радар/Холст -->
        <main class="radar-view">
            <div class="radar-header">
                <span>TARGET GRID: ACTIVE</span>
                <label class="toggle-bg">
                    <input type="checkbox" id="bgToggle"> 
                    ТЕСТ В БОЮ (ИГРОВОЙ ФОН)
                </label>
            </div>
            <div class="canvas-container">
                <canvas id="aimCanvas" width="800" height="600"></canvas>
            </div>
        </main>

        <!-- Правая панель: Калибровка и Экспорт -->
        <aside class="panel right-panel">
            <div class="panel-header">CALIBRATION // EXPORT</div>
            
            <div class="control-group">
                <label>СМЕЩЕНИЕ X: <span id="valX">0.0</span></label>
                <input type="range" id="offsetX" min="-50" max="50" value="0" step="0.5">
            </div>

            <div class="control-group">
                <label>СМЕЩЕНИЕ Y: <span id="valY">0.0</span></label>
                <input type="range" id="offsetY" min="-50" max="50" value="0" step="0.5">
            </div>

            <div class="control-group">
                <label>МАСШТАБ: <span id="valScale">1.0</span></label>
                <input type="range" id="scale" min="0.1" max="3.0" value="1.0" step="0.1">
            </div>

            <div class="stats-box">
                <div>ОБЪЕКТОВ (LINES): <span id="lineCount">0</span></div>
            </div>

            <button id="exportBtn" class="action-btn export">ЭКСПОРТ .BLK</button>
        </aside>
    </div>
    <script src="app.js"></script>
</body>
</html>
